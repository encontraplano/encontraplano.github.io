# Descarga los datos en la nube y publica la web en GitHub Pages.
# El ICAA publica el jueves el top 25 del fin de semana anterior, así que:
#   jueves:  carga de la taquilla (ICAA y, si ya la tiene, eCartelera).
#   viernes: revisión completa + sesiones de los cines del fin de semana que empieza.
#   sábado:  solo si todavía falta la taquilla del ICAA del fin de semana pasado; si no, no hace nada.
# También se lanza a mano: pestaña Actions, o el botón de la administración de la web.
# Cuando cambia algo en web/ (código, o config.json y admin.json desde la administración)
# solo se republica la web, sin descargar datos; salvo que el mensaje del commit lleve [datos].
name: actualizar

on:
  schedule:
    - cron: "37 15 * * 4"   # jueves 15:37 UTC
    - cron: "0 11 * * 5"    # viernes 11:00 UTC
    - cron: "23 10 * * 6"   # sábado 10:23 UTC (reintento)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      seguir: ${{ steps.plan.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # seguir: publicar la web. datos: descargar datos.
      # El sábado solo se trabaja si el jueves y el viernes no consiguieron la taquilla del ICAA.
      - name: ¿Hay algo que hacer?
        id: plan
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event.schedule }}" = "23 10 * * 6" ]; then
            python -I scripts/icaa.py --comprobar
            if grep -q "falta=true" "$GITHUB_OUTPUT"; then echo "seguir=true" >> "$GITHUB_OUTPUT"; echo "datos=true" >> "$GITHUB_OUTPUT"
            else echo "seguir=false" >> "$GITHUB_OUTPUT"; echo "datos=false" >> "$GITHUB_OUTPUT"; fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=true" >> "$GITHUB_OUTPUT"
            case "$MENSAJE" in *"[datos]"*) echo "datos=true" >> "$GITHUB_OUTPUT";; *) echo "datos=false" >> "$GITHUB_OUTPUT";; esac
          else
            echo "seguir=true" >> "$GITHUB_OUTPUT"; echo "datos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lector de PDF (para el ICAA)
        if: steps.plan.outputs.datos == 'true'
        run: pip install "pdfplumber>=0.11,<0.12"

      # caché de páginas y PDF ya descargados: evita volver a pedir el histórico en cada ejecución
      - uses: actions/cache@v4
        if: steps.plan.outputs.datos == 'true'
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Sesiones de los cines (solo de viernes a domingo)
        if: steps.plan.outputs.datos == 'true'
        run: python -I scripts/sesiones.py

      - name: Taquilla (ICAA y eCartelera), fichas, críticas y estrenos
        if: steps.plan.outputs.datos == 'true'
        run: python -I scripts/ingesta.py

      - name: Guardar los datos en el repositorio
        if: steps.plan.outputs.datos == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add web/data data/sesiones data/*.json data/*.csv
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          # por si la administración guardó algo mientras se descargaban los datos
          git pull --rebase --autostash origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.seguir == 'true'
        with:
          path: web

  publicar:
    needs: datos
    if: needs.datos.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
