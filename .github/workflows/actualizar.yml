# Descarga los datos en la nube y publica la web en GitHub Pages.
# Martes: taquilla del fin de semana. Viernes: sesiones de los cines + taquilla.
# También se lanza a mano: pestaña Actions, o el botón de la administración de la web.
# Cuando la administración guarda config.json o admin.json solo se republica la web (sin descargar datos).
name: actualizar

on:
  schedule:
    - cron: "0 10 * * 2"   # martes 10:00 UTC
    - cron: "0 11 * * 5"   # viernes 11:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/config.json", "web/admin.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      # caché de páginas ya descargadas: evita volver a pedir el histórico en cada ejecución
      - uses: actions/cache@v4
        if: github.event_name != 'push'
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Sesiones de los cines (solo de viernes a domingo)
        if: github.event_name != 'push'
        run: python -I scripts/sesiones.py

      - name: Taquilla, fichas, críticas y estrenos
        if: github.event_name != 'push'
        run: python -I scripts/ingesta.py

      - name: Guardar los datos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add web/data data/sesiones data/cines_directorio.json data/*.csv
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          # por si la administración guardó algo mientras se descargaban los datos
          git pull --rebase --autostash origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
